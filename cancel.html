<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payment Cancelled</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Manrope", sans-serif;
        background: linear-gradient(140deg, #fff8f0, #ffe1d6);
        color: #4f2d21;
      }
      .box {
        width: min(560px, 92vw);
        background: rgba(255, 255, 255, 0.9);
        border: 1px solid #ebcfc0;
        border-radius: 8px;
        padding: 24px;
      }
      a {
        color: #2f6638;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <article class="box">
      <h1>Payment Cancelled</h1>
      <p>Your order was not charged. You can return to the store and try again.</p>
      <p><a href="/">Back to store</a></p>
    </article>
  </body>
</html>
