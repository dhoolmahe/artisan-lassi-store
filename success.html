<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payment Successful</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Manrope", sans-serif;
        background: linear-gradient(140deg, #fff9ef, #ffeccc);
        color: #40271b;
      }
      .box {
        width: min(640px, 92vw);
        background: rgba(255, 255, 255, 0.88);
        border: 1px solid #e8d4bc;
        border-radius: 8px;
        padding: 26px;
      }
      h1 {
        margin-top: 0;
        font-size: clamp(1.7rem, 3vw, 2.2rem);
      }
      p {
        margin: 10px 0;
      }
      a {
        color: #2f6638;
        font-weight: 700;
      }
      #status {
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <article class="box">
      <h1>Payment Complete</h1>
      <p>Your lassi order has been received.</p>
      <p id="status">Finalizing your order record...</p>
      <p><a href="/">Back to store</a></p>
    </article>
    <script>
      async function finalizeOrder() {
        const sessionId = new URLSearchParams(window.location.search).get("session_id");
        const status = document.getElementById("status");
        if (!sessionId) {
          status.textContent = "Payment succeeded, but no session id was found in the URL.";
          return;
        }
        try {
          const response = await fetch("/api/confirm-order", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ sessionId }),
          });
          const data = await response.json();
          if (!response.ok) {
            throw new Error(data.error || "Order confirmation failed.");
          }
          status.textContent = "Order status updated to paid. Thank you for your purchase.";
        } catch (error) {
          status.textContent = `Payment complete. Manual confirmation needed: ${error.message}`;
        }
      }
      finalizeOrder();
    </script>
  </body>
</html>
